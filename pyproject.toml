[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tower-of-babel"
version = "0.1.0"
description = "AI systems engineering Rosetta Stone for remote AI development roles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "cyber-lazer-mermicorn" }]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyyaml>=6.0"]

[project.scripts]
tower = "tower.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
