name: Tower Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python package
        run: python -m pip install -e ".[dev]"

      - name: tower validate
        run: python -m tower validate

      - name: tower generate --check
        run: |
          python -m tower generate
          python -m tower generate --check

      - name: Python exhibits
        run: |
          python languages/python/easy_fibonacci.py
          python languages/python/advanced_async_orchestrator.py
          python languages/eval/easy_score.py
          python languages/eval/advanced_eval_harness.py
          python languages/onnx/easy_linear_model.py
          python languages/onnx/advanced_moe_router_ref.py
          python flagship/run_pipeline.py

      - name: Rust exhibits
        run: |
          rustc languages/rust/easy_counter.rs -o /tmp/easy_counter
          /tmp/easy_counter
          rustc languages/rust/advanced_safety_governor.rs -o /tmp/safety_gov
          /tmp/safety_gov

      - name: Go exhibits
        run: |
          go run languages/go/easy_ping.go
          go run languages/go/advanced_telemetry_decoder.go

      - name: TypeScript exhibits
        run: |
          npx --yes tsx languages/typescript/easy_greet.ts
          npx --yes tsx languages/typescript/advanced_mcp_gateway.ts

      - name: tower build (allow blocked)
        run: python -m tower build --all --allow-blocked
