# Canonical Tower authority — do not hand-edit generated surfaces
version: "1.2.0"
name: tower-of-babel
purpose: AI systems engineering Rosetta Stone for remote AI development roles

floors:
  - id: python
    name: Python
    class: language
    what: Rapid composition of AI, agents, evaluation, and control-plane workflows
    where: Mission orchestration, model tooling, document pipelines, tests, integration glue
    when: Iteration speed, ecosystem breadth, and readable coordination dominate
    why: Strongest general AI ecosystem and lowest friction for composing heterogeneous systems
    how: Async orchestration, evaluation harnesses, typed plans, receipts
    evidence: tested
    proof_class: behavioral
    easy: languages/python/easy_fibonacci.py
    advanced: languages/python/advanced_async_orchestrator.py
    interfaces: [mission_plan, evaluation_score, receipt]

  - id: typescript
    name: TypeScript
    class: language
    what: Static contracts over JavaScript browser/Node event-driven surface
    where: MCP/JSON-RPC gateways, web agents, connectors, async control surfaces
    when: Boundary is web-native, JSON/RPC-heavy, or shared front/back
    why: Catches interface drift before runtime while retaining JS deployment reach
    how: Runtime validation, rate limits, mutation approval, hashed receipts
    evidence: tested
    proof_class: behavioral
    easy: languages/typescript/easy_greet.ts
    advanced: languages/typescript/advanced_mcp_gateway.ts
    interfaces: [ingress_request, mcp_tool_call, receipt]

  - id: rust
    name: Rust
    class: language
    what: Native systems with compile-time ownership and no GC
    where: Authority governors, cryptographic tooling, safe concurrency, side-effect control
    when: Native performance + strong memory/concurrency guarantees are both required
    why: Borrow checker eliminates broad classes of memory corruption and data races
    how: Fail-closed policy, payload/depth/approval checks, typed decisions
    evidence: tested
    proof_class: behavioral
    easy: languages/rust/easy_counter.rs
    advanced: languages/rust/advanced_safety_governor.rs
    interfaces: [authority_decision, safety_receipt]

  - id: go
    name: Go
    class: language
    what: Simple concurrent network services and telemetry processors
    where: Gateways, control-plane daemons, streaming telemetry, cloud infrastructure
    when: Many I/O-bound tasks need straightforward concurrency and operational simplicity
    why: Goroutines, channels, static binaries, disciplined stdlib reduce service complexity
    how: Versioned frames, CRC, sequence continuity, cancellation, metrics
    evidence: tested
    proof_class: behavioral
    easy: languages/go/easy_ping.go
    advanced: languages/go/advanced_telemetry_decoder.go
    interfaces: [telemetry_event, decode_receipt]

  - id: eval
    name: Evaluation Harness
    class: framework
    what: Bounded, isolated scoring of agent and model outputs with promotion receipts
    where: Agent routing tests, model regression suites, capability gates before deployment
    when: You need reproducible pass/fail evidence rather than anecdotal demos
    why: Evaluation is the difference between a demo and a system you can trust under change
    how: Typed cases, per-case timeout isolation, weighted metrics, content digest
    evidence: tested
    proof_class: behavioral
    easy: languages/eval/easy_score.py
    advanced: languages/eval/advanced_eval_harness.py
    interfaces: [eval_case, eval_receipt]

  - id: onnx
    name: ONNX (reference router)
    class: model_format
    what: Portable typed computation graph independent of the training framework
    where: Model exchange, runtime deployment, graph inspection, expert routing sketches
    when: A model or router must move between frameworks or backends
    why: Separates learned/routing semantics from any one training library
    how: Deterministic top-k reference with explicit ONNX Runtime admission probe
    evidence: tested
    proof_class: behavioral
    easy: languages/onnx/easy_linear_model.py
    advanced: languages/onnx/advanced_moe_router_ref.py
    interfaces: [router_logits, router_receipt]

  - id: cpp
    name: C++
    class: language
    what: Low-level control with zero-cost abstractions and mature numerical libraries
    where: Inference runtimes, cache systems, latency-sensitive services, engines
    when: Performance and complex abstractions must coexist in one native binary
    why: Deterministic ownership patterns, templates, SIMD access, systems-library depth
    how: Bounded score cache with utility eviction and fingerprint receipt
    evidence: tested
    proof_class: behavioral
    easy: languages/cpp/easy_vector.cpp
    advanced: languages/cpp/advanced_kv_score_cache.cpp
    interfaces: [score_cache, eviction_receipt]

  - id: java
    name: Java
    class: language
    what: JVM runtime baseline for enterprise services and portable bytecode deployment
    where: Application servers, batch gateways, long-lived service boundaries
    when: Operational contract is the JVM and cross-organization service longevity matters
    why: Universal JVM ABI and mature concurrency utilities
    how: Bounded work queue with abort policy and outcome digest
    evidence: tested
    proof_class: behavioral
    easy: languages/java/easy_hello.java
    advanced: languages/java/advanced_bounded_work_queue.java
    interfaces: [work_queue, execution_receipt]

  - id: triton
    name: Triton (reference)
    class: kernel_language
    what: High-throughput GPU kernel ideas with Python syntax and block programming
    where: Fused attention, normalization, custom inference operations
    when: After profiling shows framework kernels inadequate and GPU is available
    why: Exposes GPU performance without hand-authoring all CUDA indexing
    how: Fused single-query attention host oracle; accelerator path hardware_gated
    evidence: tested
    proof_class: behavioral
    easy: languages/triton/easy_vector_add.py
    advanced: languages/triton/advanced_fused_attention_ref.py
    interfaces: [attention_receipt]

  - id: julia
    name: Julia
    class: language
    what: High-level mathematical syntax with JIT-compiled numerical performance
    where: ODE/PDE solvers, optimization, scientific machine learning, simulation
    when: Researchers need expressive mathematics without abandoning native-speed kernels
    why: Multiple dispatch and LLVM compilation unify interactive modeling with performance
    how: Energy-audited velocity-Verlet orbital integration with drift diagnostics
    evidence: toolchain_gated
    proof_class: compile
    easy: languages/julia/easy_matrix.jl
    advanced: languages/julia/advanced_orbital_verlet.jl
    interfaces: [orbital_state, energy_drift]

  - id: sql
    name: SQL / pgvector
    class: query_language
    what: Relational transformations, constraints, transactions, vector retrieval
    where: Canonical state, analytics, audit records, embedding search
    when: Durable data relationships and set-oriented operations belong inside the database
    why: Query planner, transactions, indexes, and constraints centralize correctness
    how: HNSW patterns, RLS, bounded search functions (service gated)
    evidence: service_gated
    proof_class: integration
    easy: languages/sql/easy_table.sql
    advanced: languages/sql/advanced_pgvector_hnsw.sql
    interfaces: [canonical_state, vector_query]

  - id: wat
    name: WebAssembly
    class: binary_format
    what: Portable capability-constrained bytecode
    where: Plugin systems, edge runtimes, zero-trust agent tools
    when: Untrusted or portable code must run within explicit host capabilities
    why: Validated bytecode + host-controlled imports create small isolation boundary
    how: Memory bounds, denied-operation immutability, audit counters
    evidence: tested
    proof_class: behavioral
    easy: languages/wat/easy_add.wat
    advanced: languages/wat/advanced_wasm_sandbox.wat
    interfaces: [sandbox_result, capability_receipt]

  - id: protobuf
    name: Protocol Buffers
    class: idl
    what: Language-neutral schemas for compact binary messages and RPC
    where: Service contracts, telemetry, receipts, cross-language mission envelopes
    when: Multiple languages need one evolvable typed contract
    why: Field-numbered schemas preserve compatibility and generate across ecosystems
    how: Mission + receipt messages with deterministic serialization
    evidence: tested
    proof_class: behavioral
    easy: languages/protobuf/easy_user.proto
    advanced: languages/protobuf/advanced_mission_receipt.proto
    interfaces: [mission, receipt]

  - id: lean4
    name: Lean 4
    class: proof_language
    what: Dependent types + executable functional programming + machine-checked proofs
    where: Safety invariants, receipt-chain correctness, verified decision gates
    when: A critical property must be proven rather than sampled by tests
    why: Kernel-checked proofs with explicit assumptions
    how: Monotone authority and receipt ordering properties
    evidence: formally_verified
    proof_class: formal
    easy: languages/lean4/easy_logic.lean
    advanced: languages/lean4/advanced_truth_gate.lean
    interfaces: [invariant_proof]
